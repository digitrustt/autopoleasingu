services:
  db:
    image: postgres:17-alpine
    container_name: auta-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: auta
      POSTGRES_PASSWORD: auta
      POSTGRES_DB: auta
    ports:
      - "5433:5432"
    volumes:
      - auta-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auta"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auta-pgdata:
