name: Zaciag ofert

# Raz dziennie. Auto to nie buty — nikt nie kupuje go w 10 minut, wiec cykl
# dziesieciominutowy z pierwotnego planu byl rozwiazaniem problemu, ktorego
# nie ma. Dobowy przebieg kosztuje ~25 min z darmowego limitu 2000 min/mc.
on:
  schedule:
    # 03:37 UTC, nie 03:00. Rowna godzina to najbardziej obciazony moment
    # w calym GitHub Actions — harmonogramy sa wtedy opozniane, a przy
    # dostatecznym obciazeniu po prostu porzucane. Pierwszy slot o 03:00
    # nie odpalil sie wcale, mimo ze workflow byl na main od poprzedniego
    # wieczora. Nierowna minuta to zalecenie z dokumentacji GitHuba.
    - cron: "37 3 * * *" # 03:37 UTC = 04:37/05:37 w Polsce
  workflow_dispatch: # reczne odpalenie z zakladki Actions
    inputs:
      limit:
        description: "Ile detali na zrodlo"
        default: "150"
      source:
        description: "Tylko jedno zrodlo (puste = wszystkie)"
        default: ""

# Dwa przebiegi naraz bilyby sie o wiersze w bazie i podwajaly ruch u zrodel.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Pelny przelot to ~25 min; limit z zapasem na wolniejsze zrodla.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Tylko Bravoauto wymaga przegladarki (listing renderuje sie po stronie
      # klienta). --with-deps dociaga biblioteki systemowe, ktorych runner nie ma.
      - name: Chromium dla Bravoauto
        run: pnpm --filter @auta/scrapers exec playwright install --with-deps chromium

      # alphabet, vwfs i carefleet odrzucaja ruch z zakresow IP centrow danych
      # (HTTP 403 albo zerwane polaczenie). Z lacza domowego dzialaja normalnie,
      # wiec zaciaga je launchd na Macu — patrz scripts/com.auta.blocked.plist.
      # Bez tego pominiecia krok konczyl sie bledem przy kazdym przebiegu.
      - name: Zaciag
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPER_CONTACT: ${{ secrets.SCRAPER_CONTACT }}
          # Te trzy odrzucaja ruch z IP centrow danych — zaciaga je launchd
          # na Macu. Bez tego pominiecia vwfs zwracal 403 i wywracal caly
          # przebieg na czerwono, mimo ze 25 pozostalych konczylo sie sukcesem.
          SKIP_SOURCES: alphabet,vwfs,carefleet
          # leasyGROUP serwuje niepelny lancuch TLS — patrz apps/worker/package.json
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/scripts/certs/certum-dv-tls-g2-r39.pem
        run: |
          if [ -n "${{ inputs.source }}" ]; then
            pnpm scrape --source "${{ inputs.source }}" --limit "${{ inputs.limit || 150 }}"
          else
            pnpm scrape --limit "${{ inputs.limit || 150 }}" --refresh-after 20
          fi

      # Wycena PO zaciagu — mediana musi widziec komplet danych, inaczej
      # skakalaby zaleznie od tego, ktore zrodla zdazyly wpasc.
      # `always()` na wycenie i alertach jest KONIECZNE. Zaciag konczy sie
      # kodem 1, gdy padnie chocby jedno zrodlo z dwudziestu szesciu — a to
      # zdarza sie regularnie, bo czesc serwisow odbija adresy IP GitHuba
      # chwilowym 403. Bez tego jeden taki 403 kasuje wycene CALEJ bazy
      # i wysylke powiadomien, mimo ze 25 zrodel zaciagnelo sie poprawnie.
      # Krok zaciagu nadal raportuje porazke, wiec sygnal nie ginie.
      - name: Wycena i deal score
        if: '!cancelled()'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm revalue

      # Alerty PO wycenie — inaczej mail lecialby bez deal score, czyli bez tej
      # jednej informacji, dla ktorej warto go otwierac.
      - name: Powiadomienia e-mail
        if: '!cancelled()'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SITE_URL: https://autopoleasingu.pl
        run: pnpm alerts

      # Bez tego cichy zgon adaptera przechodzi niezauwazony: przebieg konczy sie
      # sukcesem, tylko oferty przestaja dochodzic.
      # Cache stron trzyma sie dobe, ale liczonej od pierwszego wejscia, nie od
      # zaciagu — bez tego kroku strona odwiedzona wieczorem pokazywalaby dane
      # sprzed doby, mimo ze scraper chodzil nad ranem.
      - name: Odswiez cache strony
        if: always()
        run: |
          curl -sS -X POST https://autopoleasingu.pl/api/odswiez \
            -H "Authorization: Bearer ${{ secrets.REVALIDATE_SECRET }}" \
            --max-time 60 || echo "nie udalo sie odswiezyc cache"

      - name: Podsumowanie
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @auta/worker summary >> "$GITHUB_STEP_SUMMARY"
