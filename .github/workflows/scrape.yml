name: Zaciag ofert

# Raz dziennie. Auto to nie buty — nikt nie kupuje go w 10 minut, wiec cykl
# dziesieciominutowy z pierwotnego planu byl rozwiazaniem problemu, ktorego
# nie ma. Dobowy przebieg kosztuje ~25 min z darmowego limitu 2000 min/mc.
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC = 04:00/05:00 w Polsce
  workflow_dispatch: # reczne odpalenie z zakladki Actions
    inputs:
      limit:
        description: "Ile detali na zrodlo"
        default: "150"
      source:
        description: "Tylko jedno zrodlo (puste = wszystkie)"
        default: ""

# Dwa przebiegi naraz bilyby sie o wiersze w bazie i podwajaly ruch u zrodel.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Pelny przelot to ~25 min; limit z zapasem na wolniejsze zrodla.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Tylko Bravoauto wymaga przegladarki (listing renderuje sie po stronie
      # klienta). --with-deps dociaga biblioteki systemowe, ktorych runner nie ma.
      - name: Chromium dla Bravoauto
        run: pnpm --filter @auta/scrapers exec playwright install --with-deps chromium

      - name: Zaciag
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPER_CONTACT: ${{ secrets.SCRAPER_CONTACT }}
          # leasyGROUP serwuje niepelny lancuch TLS — patrz apps/worker/package.json
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/scripts/certs/certum-dv-tls-g2-r39.pem
        run: |
          if [ -n "${{ inputs.source }}" ]; then
            pnpm scrape --source "${{ inputs.source }}" --limit "${{ inputs.limit || 150 }}"
          else
            pnpm scrape --limit "${{ inputs.limit || 150 }}" --refresh-after 20
          fi

      # Wycena PO zaciagu — mediana musi widziec komplet danych, inaczej
      # skakalaby zaleznie od tego, ktore zrodla zdazyly wpasc.
      - name: Wycena i deal score
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm revalue

      # Alerty PO wycenie — inaczej mail lecialby bez deal score, czyli bez tej
      # jednej informacji, dla ktorej warto go otwierac.
      - name: Powiadomienia e-mail
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SITE_URL: https://autopoleasingu.pl
        run: pnpm alerts

      # Bez tego cichy zgon adaptera przechodzi niezauwazony: przebieg konczy sie
      # sukcesem, tylko oferty przestaja dochodzic.
      - name: Podsumowanie
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @auta/worker summary >> "$GITHUB_STEP_SUMMARY"
