<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Favicon: radar omiatajacy — ten sam motyw co ekran ladowania.

    Uproszczony wzgledem tamtego SWIADOMIE: przy 16 px trzy kregi i krzyz
    zlewaja sie w szara plame. Zostaje jeden okrag, jeden klin i punkt w srodku,
    czyli tyle, ile realnie da sie odczytac na karcie przegladarki.

    Kolory na sztywno, nie z motywu: favicon renderuje sie poza dokumentem,
    wiec zmienne CSS z globals.css tu nie docieraja.
  -->
  <rect width="32" height="32" rx="7" fill="#0b0d10" />
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#f2f5f9" stroke-opacity="0.28" stroke-width="1.6" />
  <!-- Klin wiazki: od srodka do krawedzi, cwiartka tarczy. -->
  <path d="M16 16 L16 6.5 A9.5 9.5 0 0 1 22.7 9.3 Z" fill="#f2f5f9" fill-opacity="0.9" />
  <circle cx="16" cy="16" r="2" fill="#f2f5f9" />
</svg>
