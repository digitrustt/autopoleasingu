<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Favicon: litera "a" z logotypu.

    Poprzednia wersja (radar) byla za drobna — przy 16 px okrag z klinem
    zamienial sie w szara plamke. Logo serwisu jest slowne, wiec ikona bierze
    z niego pierwsza litere: to jedyny element, ktory pozostaje czytelny
    na karcie przegladarki i od razu wiaze sie z nazwa.

    Kolory na sztywno — favicon renderuje sie poza dokumentem, wiec zmienne
    z globals.css tu nie docieraja.
  -->
  <rect width="32" height="32" rx="8" fill="#f2f5f9" />
  <text
    x="16"
    y="16"
    fill="#0b0d10"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="23"
    font-weight="700"
    text-anchor="middle"
    dominant-baseline="central"
  >a</text>
</svg>
